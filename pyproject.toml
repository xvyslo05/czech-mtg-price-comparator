[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cz-mtg-compare-mcp"
version = "0.1.0"
description = "MCP server that compares Magic: The Gathering single-card prices across Czech online shops."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Robin Vyslouzil" }]
dependencies = [
    "mcp>=1.2.0",
    "httpx[http2]>=0.27",
    "selectolax>=0.3.21",
    "pydantic>=2.7",
    "tenacity>=8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
cz-mtg-compare-mcp = "cz_mtg_compare.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cz_mtg_compare"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "live: hits real shop websites; opt-in via -m live",
]
testpaths = ["tests"]
addopts = "-m 'not live'"
